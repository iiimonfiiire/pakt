# Content types that PAKT knows. This file defines the types only: names, path hints,
# a parent for subtypes, and tags. The active style guide supplies every requirement,
# under [content_types.<type>] in its rules.toml, so each requirement cites its guide.
# A rule's by_type table can target a type ID, a parent ID, or a tag.

[kb_article]
name = "KB article"
description = "Knowledge base family. PAKT refines it to a subtype from the content."
path_hints = ["kb", "help", "guide", "guides", "articles", "faq", "docs-kb"]
tags = ["instructional"]

[kb_task]
name = "KB task-based guide"
parent = "kb_article"
description = "A how-to article built around one goal and a procedure."
path_hints = ["how-to", "howto", "tasks"]
tags = ["instructional", "procedural"]

[kb_concept]
name = "KB conceptual article"
parent = "kb_article"
description = "Explains what something is and how it works, with links to related tasks."
path_hints = ["concepts", "overview", "overviews", "architecture"]
tags = ["instructional", "conceptual"]

[kb_troubleshooting]
name = "Troubleshooting guide"
parent = "kb_article"
description = "Symptom, cause, and resolution for one problem."
path_hints = ["troubleshooting", "troubleshoot", "known-issues"]
tags = ["instructional", "procedural"]

[walkthrough]
name = "Product walkthrough"
parent = "kb_article"
description = "A guided path through the product UI."
path_hints = ["walkthrough", "walkthroughs", "tour"]
tags = ["instructional", "procedural"]

[concept_guide]
name = "Concept guide"
parent = "kb_article"
description = "Learning content: theory and mental models, with no procedures."
path_hints = ["learn", "learning", "academy"]
tags = ["instructional", "conceptual"]

[tutorial]
name = "Tutorial"
parent = "kb_article"
description = "Learning content: an end-to-end path with objectives, concepts, procedures, and verification."
path_hints = ["tutorial", "tutorials", "course", "lessons"]
tags = ["instructional", "procedural"]

[quickstart]
name = "Quickstart"
parent = "kb_article"
description = "Learning content: the fastest procedural path, with zero conceptual overhead."
path_hints = ["quickstart", "quick-start", "getting-started", "get-started"]
tags = ["instructional", "procedural"]

[release_note]
name = "Release notes"
description = "Version announcements, changelogs, and what's-new pages."
path_hints = ["release", "releases", "release-notes", "changelog", "changelogs", "whats-new"]
tags = ["corporate_voice"]

[ui_microcopy]
name = "UX microcopy"
description = "UI strings: buttons, labels, error messages, empty states, tooltips, toasts, and modals."
path_hints = ["microcopy", "strings", "locales", "locale", "i18n", "l10n", "ui-text"]
tags = ["instructional"]

[api_doc]
name = "API documentation"
description = "Endpoint reference pages that map to an OpenAPI or Swagger spec."
path_hints = ["api", "apis", "reference", "endpoints", "endpoint", "rest"]
tags = ["instructional", "technical"]

[gtm_brief]
name = "GTM and product handoff brief"
description = "Go-to-market enablement briefs that hand a launch to sales, support, and marketing."
path_hints = ["gtm", "launch", "launches", "enablement", "handoff", "briefs"]
tags = ["corporate_voice"]

[post_mortem]
name = "Incident post-mortem"
description = "An organizational account of an incident. Only the voice rules apply for now."
path_hints = ["postmortem", "postmortems", "post-mortem", "post-mortems", "incidents", "incident"]
tags = ["corporate_voice"]

[general]
name = "General documentation"
description = "Any other prose. Only the general style rules apply."
path_hints = []
tags = []
