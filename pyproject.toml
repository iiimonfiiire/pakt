[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pakt"
version = "0.2.0"
description = "Portable Agentic Knowledge Toolkit: review, audit, and draft documentation against a pluggable style guide"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pakt = "pakt.cli:main"
pakt-eval = "pakt_evals.cli:main"

[tool.setuptools.packages.find]
where = [".", "evals"]
include = ["pakt", "pakt.*", "pakt_evals*"]

[tool.pytest.ini_options]
testpaths = ["evals/tests"]
