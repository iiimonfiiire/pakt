# PAKT configuration. Environment variables in .env override the models.
# A project can pick its own style guide in a .pakt.toml file. See docs/style-guides.md.

# The default style guide: Signal, fetched from its public repo and pinned to a release tag.
# Keep DEFAULT_SOURCE in pakt/sources.py in step with this pin.
[styleguide]
source = "github:iiimonfiiire/signal-style-guide@v2026.10.06"
rules = "signal.rules.toml"

[review]
model = "claude-sonnet-5-5"
max_tokens = 2000
temperature = 0.0
prompt = "prompts/review/v1.md"

[models]
generator = "claude-haiku-4-5-20251001"
judge = "claude-sonnet-5-5"

[generation]
max_tokens = 1500
temperature = 0.0
concurrency = 4

[judge]
max_tokens = 800
temperature = 0.0
prompt = "prompts/judge/v1.md"
pass_threshold = 4

# USD per million tokens. Verify against current published pricing before quoting costs.
[pricing."claude-haiku-4-5-20251001"]
input = 1.00
output = 5.00

[pricing."claude-sonnet-5-5"]
input = 3.00
output = 15.00

[paths]
testset = "evals/data/testset.jsonl"
spot_check = "evals/data/judge_spot_check.jsonl"
reviewer_dir = "evals/data/reviewer"
prompts_dir = "prompts"
cache_dir = "evals/.cache"
results_dir = "evals/results"
